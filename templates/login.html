{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:40px auto 0">
  <h1>Log in</h1>
  <p class="sub">Real Estate Launch Reports access is per agent. Contact your admin if you don't have a login yet.</p>
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button class="btn" type="submit" style="width:100%">Log in</button>
  </form>
</div>
{% endblock %}
